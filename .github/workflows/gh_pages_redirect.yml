# Deploys docs/pages_redirector/ to GitHub Pages.
# pthom.github.io/imgui_bundle/* redirects to imgui-bundle.pages.dev/*.
name: Deploy GitHub Pages redirect

on:
  push:
    branches:
      - main
    paths:
      - 'docs/pages_redirector/**'
      - '.github/workflows/gh_pages_redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/pages_redirector

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
