name: "Emscripten"

on:
  workflow_dispatch:
  pull_request:
  push:


# The token reads only; a job that publishes asks for more
permissions:
  contents: read

jobs:
  build:
    name: Emscripten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

#      - name: Setup interactive tmate session
#        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.9

      # The same emsdk as the web site's deploy (cf_pages_deploy.yml): the CI checks what ships
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 5.0.4
          actions-cache-folder: 'emsdk-cache'

      - name: Build and install
        shell: bash
        run: |
          mkdir build_ems
          cd build_ems
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j 4
