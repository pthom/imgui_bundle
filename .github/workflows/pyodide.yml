name: Pyodide

on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - published
  push:
    branches:
      - master
      - main

# The token reads only; a job that publishes asks for more
permissions:
  contents: read

jobs:
  build_pyodide_wheel:
    name: Build Pyodide Wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2

      - name: Install Pyodide build environment
        shell: bash
        run: |
          ./ci_scripts/pyodide_local_build/setup_pyodide_local_build.sh

      - name: Build Pyodide wheel
        shell: bash
        run: |
          source ci_scripts/pyodide_local_build/venv_pyo/bin/activate
          source ci_scripts/pyodide_local_build/emsdk/emsdk_env.sh
          IMGUI_BUNDLE_SLIM_PYODIDE_WHEEL=1 pyodide build

      # Note: the `*pyemscripten*` glob below matches the wheel platform tag
      # `pyemscripten_YYYY_M_wasm32` produced by pyodide-build 0.34.1+ (PEP 783).
      # If pyodide-build renames the tag again, update this glob and the
      # justfile globs (pyodide_build / pyodide_clean) accordingly. See the
      # UPGRADE RUNBOOK at the top of
      # ci_scripts/pyodide_local_build/config_versions_pyodide.sh.
      - name: List built wheels
        run: |
          echo "Built wheels:"
          ls -lh dist/*pyemscripten*.whl

      - name: Upload Pyodide wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pyodide-wheel
          path: dist/*pyemscripten*.whl
          if-no-files-found: error

  upload_to_release:
    name: Upload wheel to GitHub Release
    needs: build_pyodide_wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
      - name: Download Pyodide wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pyodide-wheel
          path: dist

      - name: List downloaded wheels
        run: |
          echo "Wheels to upload:"
          ls -lh dist/*.whl

      - name: Upload wheel to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_to_pypi:
    name: Upload wheel to PyPI
    needs: build_pyodide_wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download Pyodide wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pyodide-wheel
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
