name: Cloudflare Pages deploy

on:
  workflow_dispatch:
#  pull_request:
#  release:
#    types:
#      - published
#  push:
#    branches:
#      - master
#      - main

# Refuse concurrent runs
concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: "Build Cloudflare Pages deploy"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      #
      # Install required apps (just, python, emscripten, etc)
      # =====================================================
      # install just
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      # install emscripten (and cache it)
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          # Make sure to set a version number!
          version: 5.0.4
          # This is the name of the cache folder.
          # The cache folder will be placed in the build directory,
          #  so make sure it doesn't conflict with anything!
          actions-cache-folder: 'emsdk-cache'
      - name: Verify emscripten toolchain
        run: emcc -v
      # Install python 3.13 required by pyodide
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # install jupyter-book
      - name: Install jupyter-book requirements
        run: pip install -r docs/book/requirements.txt
      # install typst
      - name: Install Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108  # v5.3.0b2
      #
      # Optional ssh / debug
      # =====================================================
      # - name: Setup interactive tmate session
      #   uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.9

      #
      # Build all elements
      # =====================================================
      - name: builds elements (doc, explorer, pyodide wheel, etc) - long!
        run: just cf_stage_prepare

      #
      # Stage the site, and hand it to the deploy job
      # =====================================================
      - name: Stage site
        run: just cf_stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cf_staging
          path: _cf_staging
          retention-days: 1

  # The secrets live in this job only, on a fresh runner that ran none of the build's tools (pip, npm, emscripten,
  # the submodules' CMake): a compromised dependency of the build cannot read them.
  deploy:
    name: "Deploy to Cloudflare Pages"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cf_staging
          path: _cf_staging
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.83.0 pages deploy _cf_staging --project-name=imgui-bundle --branch=main
