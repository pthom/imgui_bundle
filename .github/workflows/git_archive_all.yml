name: git-archive-all

on:
  push:
    tags:
      - '**'

# The token reads only; a job that publishes asks for more
permissions:
  contents: read

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Package source code including submodules
        uses: qmonnet/git-archive-all-action@791fb850881cf58b1d1fcc9b06c01940080bba0a  # v1.0.1
        with:
          output-files: srcs-full-${{ github.ref_name }}.tar.gz
          base-repo: project

      - name: Create draft release and add artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          draft: true
          files: srcs-full-*