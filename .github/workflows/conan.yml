name: "Conan"

# Builds the Conan 2 package (conan/conanfile.py) from this checkout, then its test package (conan create),
# on Windows (MSVC x64, Release and Debug), Linux (x64 and arm64) and macOS (arm64).
#
# The dependencies (freetype, glfw, libcurl, ...) come from ConanCenter, built here when it has no binary
# for the runner's compiler; a cache keeps them between runs. On Linux, Conan installs the system packages
# of X11 and OpenGL with apt. Nothing is uploaded.
#
# It runs when the recipe or this file changes, once a week (for the other changes of the bundle, and the new
# revisions of ConanCenter's recipes), and by hand.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"  # Mondays, 02:00 UTC
  pull_request:
    paths: ["conan/**", ".github/workflows/conan.yml"]
  push:
    paths: ["conan/**", ".github/workflows/conan.yml"]

# The token reads only; a job that publishes asks for more
permissions:
  contents: read

jobs:
  build:
    name: Conan (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-release, runner: windows-latest, build_type: Release }
          - { name: windows-x64-debug, runner: windows-latest, build_type: Debug }
          - { name: linux-x64, runner: ubuntu-24.04, build_type: Release }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, build_type: Release }
          - { name: macos-arm64, runner: macos-latest, build_type: Release }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"

    - name: Install Conan
      shell: bash
      run: |
        pip install conan==2.34.0
        # A short path for the Conan home: MSVC's limit on path lengths (260) is close in the build folders
        echo "CONAN_HOME=$RUNNER_TEMP/conan" >> "$GITHUB_ENV"

    - name: Restore the dependencies (Conan packages)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: conan-${{ matrix.name }}-${{ hashFiles('conan/conanfile.py') }}
        restore-keys: conan-${{ matrix.name }}-

    - name: conan create (from this checkout)
      shell: bash
      run: |
        conan profile detect --force
        conan create conan -s build_type=${{ matrix.build_type }} -s compiler.cppstd=17 \
            -c user.imgui_bundle:source_dir="$GITHUB_WORKSPACE" \
            ${{ runner.os == 'Linux' && '-c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True' || '' }} \
            --build=missing

    - name: Keep only the dependencies in the cache
      shell: bash
      run: |
        conan remove "imgui_bundle/*" -c
        conan cache clean "*" --source --build --download --temp
